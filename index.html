<!doctype html><html lang="sq"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CalorieSnap AI</title><style>body{font:16px system-ui;background:#edf2f4;color:#193247;margin:0}main{max-width:560px;margin:auto;padding:20px}h1{font-size:26px}.card{background:white;border-radius:18px;padding:20px;margin:15px 0}button{border:0;border-radius:10px;padding:14px;background:#167768;color:white;font-weight:bold;font-size:15px;cursor:pointer}button:active{opacity:.7}input,select{width:100%;padding:13px;font-size:16px;box-sizing:border-box;border:1px solid #c9d5df;border-radius:10px;margin:8px 0 16px}nav{display:flex;gap:8px}nav button{flex:1}.hidden{display:none}.muted{color:#667987}.row{display:flex;gap:7px}.row button{flex:1;padding:10px}.big{font-size:40px;font-weight:800}#preview{max-width:100%}</style><main><h1>◈ CalorieSnap AI</h1><p class="muted">Version provë në Safari · pa pagesë</p><div class="card"><div class="muted">Kaloritë sot</div><div class="big"><span id="total">0</span> kcal</div><span id="remaining"></span></div><nav><button data-tab="add">Ushqimi</button><button data-tab="history">Historiku</button><button data-tab="settings">Preferencat</button></nav><section id="add"><div class="card"><h2>Fotografia</h2><p class="muted">Fotografia shfaqet, por analiza automatike AI nuk është aktive.</p><input type="file" accept="image/*" id="photo"><img id="preview"></div><div class="card"><h2>Regjistro vaktin</h2><button id="demo">Shto vakt demonstrues · 525 kcal</button><label><p>Kërko ushqimin</p><input id="search" placeholder="Flija, oriz, pulë…"></label><label><p>Zgjidh ushqimin</p><select id="food"></select></label><p>Sasia në gramë</p><div class="row"><button data-grams="100">100 g</button><button data-grams="150">150 g</button><button data-grams="200">200 g</button><button data-grams="250">250 g</button></div><input type="number" min="1" max="5000" id="grams" value="150"><h2 id="calc">0 kcal</h2><p id="macros"></p><button id="save">Shto në ditar</button><p id="message"></p></div></section><section id="history" class="hidden"><div class="card"><h2>Historiku sot</h2><div id="entries"></div><button id="clear">Pastro ditarin</button></div></section><section id="settings" class="hidden"><div class="card"><h2>Objektivi ditor</h2><input id="goal" type="number" value="2000"><button id="saveGoal">Ruaj objektivin</button><p id="goalmsg"></p></div></section><p class="muted">Vlerat ushqyese janë vlerësime orientuese, jo matje laboratorike.</p></main><script>
const foods=[['Flija',280,8,35,12],['Oriz i zier',130,2.7,28,.3],['Pulë e pjekur',165,31,0,3.6],['Salmon',208,20,0,13],['Bukë',265,9,49,3.2],['Vezë',155,13,1.1,11],['Banane',89,1.1,23,.3],['Mollë',52,.3,14,.2],['Patate të ziera',87,1.9,20,.1],['Pite me djathë',290,10,29,15],['Byrek me mish',310,12,30,16],['Qebapa',250,17,3,19],['Kos',61,3.5,4.7,3.3],['Sallatë',30,1.5,5,.5],['Makarona të ziera',158,5.8,31,.9],['Pizza',266,11,33,10],['Djathë',300,20,2,24],['Supë perimesh',40,2,6,1],['Fasule të ziera',127,8.7,23,.5],['Burek',310,10,31,17]];
const $=id=>document.getElementById(id),date=()=>new Date().toLocaleDateString('sv-SE');let state={day:date(),goal:2000,entries:[]};try{const s=JSON.parse(localStorage.getItem('caloriesnap-live-v1'));if(s){state.goal=s.goal||2000;if(s.day===date())state.entries=s.entries||[]}}catch(e){}
const store=()=>{try{localStorage.setItem('caloriesnap-live-v1',JSON.stringify(state))}catch(e){}};
function filter(){const q=$('search').value.toLowerCase(),previous=$('food').value;$('food').replaceChildren();foods.forEach((f,i)=>{if(f[0].toLowerCase().includes(q)){const o=document.createElement('option');o.value=i;o.textContent=f[0];$('food').append(o)}});if([...$('food').options].some(o=>o.value===previous))$('food').value=previous;calc()}
function calc(){const f=foods[+$('food').value],g=+$('grams').value;if(!f||!$('food').options.length||g<=0||g>5000){$('calc').textContent='— kcal';$('macros').textContent='Zgjidh ushqimin dhe sasinë';return null}const x={name:f[0],grams:g,kcal:Math.round(f[1]*g/100),protein:(f[2]*g/100).toFixed(1),carbs:(f[3]*g/100).toFixed(1),fat:(f[4]*g/100).toFixed(1)};$('calc').textContent=x.kcal+' kcal';$('macros').textContent='Proteina '+x.protein+' g · Karbohidrate '+x.carbs+' g · Yndyrna '+x.fat+' g';return x}
function render(){const sum=state.entries.reduce((a,x)=>a+x.kcal,0);$('total').textContent=sum;$('remaining').textContent='Objektivi '+state.goal+' kcal · Mbeten '+Math.max(0,state.goal-sum)+' kcal';$('entries').replaceChildren();state.entries.forEach((x,i)=>{const d=document.createElement('p'),b=document.createElement('button');d.textContent=x.name+' · '+x.grams+' g · '+x.kcal+' kcal ';b.textContent='Hiq';b.onclick=()=>{state.entries.splice(i,1);store();render()};d.append(b);$('entries').append(d)});if(!state.entries.length)$('entries').textContent='Nuk ka vakte sot.';$('goal').value=state.goal}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{['add','history','settings'].forEach(t=>$(t).classList.toggle('hidden',t!==b.dataset.tab))});
document.querySelectorAll('[data-grams]').forEach(b=>b.onclick=()=>{$('grams').value=b.dataset.grams;calc()});
$('search').oninput=filter;$('food').onchange=calc;$('grams').oninput=calc;
$('save').onclick=()=>{const x=calc();if(!x){$('message').textContent='Zgjidh sasinë e vlefshme';return}state.entries.push(x);store();render();$('message').textContent='U shtua në ditar ✓'};
$('demo').onclick=()=>{state.entries.push({name:'Vakt demonstrues',grams:400,kcal:525});store();render();$('message').textContent='U shtua vakti demonstrues ✓'};
$('clear').onclick=()=>{if(confirm('Ta pastrojmë ditarin?')){state.entries=[];store();render()}};
$('saveGoal').onclick=()=>{const n=+$('goal').value;if(n>=500&&n<=10000){state.goal=n;store();render();$('goalmsg').textContent='U ruajt ✓'}else $('goalmsg').textContent='Zgjidh 500–10000 kcal'};
$('photo').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{$('preview').src=r.result};r.readAsDataURL(f)}};
filter();render();
</script></html>
